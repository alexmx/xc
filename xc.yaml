# xc's own configuration: xc dogfooding itself.
#
# The tool is a SwiftPM package, so its commands use the swift toolchain.
# The example projects are registered as members, which exercises the monorepo
# feature against this very repo:
#
#   xc build                 # build the xc tool
#   xc build:release         # the universal release binary the release workflow ships
#   xc test                  # run the test suite
#   xc list                  # see commands + example members
#   xc package/build         # build the Swift Package example
#   xc -C Examples/Package swift-test
#   xc build --all --dry-run # preview building every example member
#   xc gate                  # lint, build and test, with a timing summary
#   xc smoke                 # end-to-end check of a release build against the examples
#   xc smoke -- steps        # just one group (see scripts/smoke.py)

commands:
  build:
    run: "swift build"
    variants:
      release:
        run: "swift build -c release --arch arm64 --arch x86_64"
  test:
    run: "swift test"
  lint:
    run: "swiftformat Sources Tests --lint"
    variants:
      fix:
        run: "swiftformat Sources Tests"
  gate:
    steps: [lint, build, test]
  smoke:
    run: 'swift build -c release && python3 -I scripts/smoke.py "$(swift build -c release --show-bin-path)/xc"'

members:
  app: Examples/App
  mac: Examples/MacApp
  package: Examples/Package
  monorepo: Examples/Monorepo
